<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptlet Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #343a40;
            --light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo i {
            font-size: 2rem;
            color: var(--primary);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-online {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-offline {
            background: var(--danger);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .tabs {
            display: flex;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .tab {
            padding: 1rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            flex: 1;
            font-weight: 500;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            border-bottom: 3px solid var(--primary);
            color: var(--primary);
            background: rgba(74, 111, 165, 0.1);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #eee;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card h3 {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
        }

        .card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            min-height: 3.6rem;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            margin-right: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #3a5a8c;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
        }

        .status-bar {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status-message {
            font-size: 0.9rem;
            color: #666;
        }

        .connection-status {
            font-size: 0.8rem;
            color: #999;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .tab-content.active {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                text-align: left;
                padding: 1rem;
                border-bottom: 1px solid #eee;
            }
            
            .tab.active {
                border-left: 3px solid var(--primary);
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>Scriptlet Launcher</h1>
            </div>
            <div class="status">
                <span class="status-indicator" id="connectionIndicator"></span>
                <span id="connectionStatus">Connecting...</span>
            </div>
        </header>

        <div class="tabs" id="categoryTabs">
            <!-- Tabs will be generated dynamically -->
        </div>

        <div id="scriptletsContainer">
            <!-- Scriptlet cards will be generated dynamically -->
        </div>

        <div class="status-bar">
            <div class="status-message" id="statusMessage">Ready to launch scripts</div>
            <div class="status-actions">
                <div class="connection-status" id="serverStatus">Checking server connection...</div>
            </div>
        </div>
    </div>

    <script>
        let isServerOnline = false;
        let serverURL = 'http://localhost:8765';
        let allScriptlets = [];
        let categories = new Set();

        // Check server connection on load
        window.addEventListener('load', () => {
            checkServerConnection();
            loadScriptlets();
            setInterval(checkServerConnection, 5000); // Check every 5 seconds
            setInterval(loadScriptlets, 10000); // Reload scriptlets every 10 seconds to update running status
        });

        // Load scriptlets from API
        async function loadScriptlets() {
            if (!isServerOnline) {
                return;
            }

            try {
                const response = await fetch(`${serverURL}/scriptlets`, {
                    method: 'GET',
                    timeout: 5000
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                // Handle both array and object responses
                if (Array.isArray(data)) {
                    allScriptlets = data;
                } else if (data && typeof data === 'object') {
                    // If it's an object, try to extract array
                    allScriptlets = Object.values(data).flat();
                } else {
                    throw new Error('Invalid response format');
                }

                // Extract categories
                categories = new Set(allScriptlets.map(s => s.category || 'utilities'));
                
                // Generate UI
                generateTabs();
                generateScriptletCards();
                
                updateStatus(`Loaded ${allScriptlets.length} scriptlets`);
            } catch (error) {
                console.error('Failed to load scriptlets:', error);
                updateStatus(`Error loading scriptlets: ${error.message}`);
            }
        }

        // Update running status for all scriptlets
        function updateRunningStatus() {
            allScriptlets.forEach(scriptlet => {
                updateButtonStates(scriptlet.id + '.ahk', scriptlet.running || false);
            });
        }

        // Generate category tabs dynamically
        function generateTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            const categoryOrder = ['utilities', 'system', 'productivity', 'development', 'games', 'fun', 'office'];
            const categoryLabels = {
                'utilities': 'Utilities',
                'system': 'System',
                'productivity': 'Productivity',
                'development': 'Development',
                'games': 'Games',
                'fun': 'Fun',
                'office': 'Office'
            };

            // Add tabs in order, then any remaining categories
            const sortedCategories = [...categoryOrder.filter(c => categories.has(c)), ...Array.from(categories).filter(c => !categoryOrder.includes(c))];

            sortedCategories.forEach((category, index) => {
                const tab = document.createElement('div');
                tab.className = 'tab' + (index === 0 ? ' active' : '');
                tab.setAttribute('data-tab', category);
                tab.textContent = categoryLabels[category] || category.charAt(0).toUpperCase() + category.slice(1);
                tab.addEventListener('click', () => switchTab(category));
                tabsContainer.appendChild(tab);
            });
        }

        // Generate scriptlet cards dynamically
        function generateScriptletCards() {
            const container = document.getElementById('scriptletsContainer');
            container.innerHTML = '';

            // Group scriptlets by category
            const scriptletsByCategory = {};
            allScriptlets.forEach(scriptlet => {
                const cat = scriptlet.category || 'utilities';
                if (!scriptletsByCategory[cat]) {
                    scriptletsByCategory[cat] = [];
                }
                scriptletsByCategory[cat].push(scriptlet);
            });

            // Create tab content for each category
            Object.keys(scriptletsByCategory).forEach((category, index) => {
                const tabContent = document.createElement('div');
                tabContent.id = category;
                tabContent.className = 'tab-content' + (index === 0 ? ' active' : '');
                
                scriptletsByCategory[category].forEach(scriptlet => {
                    const card = createScriptletCard(scriptlet);
                    tabContent.appendChild(card);
                });

                container.appendChild(tabContent);
            });
        }

        // Create a card for a scriptlet
        function createScriptletCard(scriptlet) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-scriptlet-id', scriptlet.id);

            const icon = getIconForScriptlet(scriptlet);
            const description = scriptlet.description || `Run ${scriptlet.name}`;
            const isRunning = scriptlet.running || false;
            const runDisabled = isRunning ? 'disabled' : '';
            const stopDisabled = isRunning ? '' : 'disabled';

            card.innerHTML = `
                <div class="card-header">
                    <i class="${icon}"></i>
                    <h3>${escapeHtml(scriptlet.name)}</h3>
                </div>
                <div class="card-body">
                    <p>${escapeHtml(description)}</p>
                    <button class="btn btn-primary run-btn" onclick="runScript('${escapeHtml(scriptlet.id)}.ahk', this)" ${runDisabled}>
                        <i class="fas fa-play"></i> Run
                    </button>
                    <button class="btn btn-danger stop-btn" onclick="stopScript('${escapeHtml(scriptlet.id)}.ahk', this)" ${stopDisabled} style="margin-left: 0.5rem;">
                        <i class="fas fa-stop"></i> Stop
                    </button>
                </div>
            `;

            return card;
        }

        // Get icon based on scriptlet name/category
        function getIconForScriptlet(scriptlet) {
            const name = (scriptlet.name || '').toLowerCase();
            const id = (scriptlet.id || '').toLowerCase();
            const category = (scriptlet.category || '').toLowerCase();

            // Game icons
            if (category === 'games' || name.includes('game') || id.includes('game')) {
                if (name.includes('chess') || id.includes('chess')) return 'fas fa-chess';
                if (name.includes('tetris') || id.includes('tetris')) return 'fas fa-th';
                if (name.includes('snake') || id.includes('snake')) return 'fas fa-snake';
                if (name.includes('sudoku') || id.includes('sudoku')) return 'fas fa-puzzle-piece';
                if (name.includes('pacman') || id.includes('pacman')) return 'fas fa-ghost';
                return 'fas fa-gamepad';
            }

            // System icons
            if (category === 'system' || name.includes('system') || id.includes('system')) {
                if (name.includes('monitor') || id.includes('monitor')) return 'fas fa-chart-line';
                if (name.includes('window') || id.includes('window')) return 'fas fa-window-maximize';
                if (name.includes('clipboard') || id.includes('clipboard')) return 'fas fa-clipboard';
                if (name.includes('volume') || id.includes('volume')) return 'fas fa-volume-up';
                return 'fas fa-cog';
            }

            // Development icons
            if (category === 'development' || name.includes('dev') || id.includes('dev') || name.includes('mcp') || id.includes('mcp')) {
                if (name.includes('git') || id.includes('git')) return 'fab fa-git-alt';
                if (name.includes('code') || id.includes('code')) return 'fas fa-code';
                return 'fas fa-laptop-code';
            }

            // Fun/Prank icons
            if (category === 'fun' || name.includes('prank') || id.includes('prank') || name.includes('fun') || id.includes('fun')) {
                return 'fas fa-smile';
            }

            // Productivity icons
            if (category === 'productivity') {
                if (name.includes('note') || id.includes('note')) return 'fas fa-sticky-note';
                if (name.includes('text') || id.includes('text')) return 'fas fa-font';
                return 'fas fa-tasks';
            }

            // Office icons
            if (category === 'office') {
                return 'fas fa-briefcase';
            }

            // Default
            return 'fas fa-rocket';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Switch tabs
        function switchTab(category) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // Add active class to clicked tab and corresponding content
            const tab = document.querySelector(`.tab[data-tab="${category}"]`);
            const content = document.getElementById(category);
            
            if (tab) tab.classList.add('active');
            if (content) content.classList.add('active');
        }

        // Check if server is running
        async function checkServerConnection() {
            const indicator = document.getElementById('connectionIndicator');
            const status = document.getElementById('connectionStatus');
            const serverStatus = document.getElementById('serverStatus');

            try {
                const response = await fetch(`${serverURL}/status`, {
                    method: 'GET',
                    timeout: 2000
                });

                if (response.ok) {
                    isServerOnline = true;
                    indicator.className = 'status-indicator status-online';
                    status.textContent = 'AHK Bridge Online';
                    serverStatus.textContent = 'COM Bridge: Connected';
                    // Reload scriptlets when connection is restored
                    if (allScriptlets.length === 0) {
                        loadScriptlets();
                    }
                } else {
                    throw new Error('Server responded with error');
                }
            } catch (error) {
                isServerOnline = false;
                indicator.className = 'status-indicator status-offline';
                status.textContent = 'AHK Bridge Offline';
                serverStatus.textContent = 'COM Bridge: Disconnected - Start ScriptletCOMBridge.ahk';
            }
        }

        // Run a script via the COM bridge
        async function runScript(scriptName, buttonElement) {
            if (!isServerOnline) {
                updateStatus('ERROR: COM Bridge is offline. Please start ScriptletCOMBridge.ahk');
                return;
            }

            updateStatus(`Starting: ${scriptName}...`);

            try {
                const response = await fetch(`${serverURL}/run/${scriptName}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.text();
                updateStatus(result);

                // Update button states if successful
                if (result.includes('SUCCESS')) {
                    updateButtonStates(scriptName, true);
                    // Visual feedback
                    if (buttonElement) {
                        buttonElement.style.background = '#28a745';
                        setTimeout(() => {
                            buttonElement.style.background = '';
                        }, 1000);
                    }
                    // Refresh scriptlet list to get updated running status
                    setTimeout(() => loadScriptlets(), 1000);
                }

            } catch (error) {
                updateStatus(`ERROR: Failed to run ${scriptName} - ${error.message}`);
            }
        }

        // Stop a script
        async function stopScript(scriptName, buttonElement) {
            if (!isServerOnline) {
                updateStatus('ERROR: COM Bridge is offline');
                return;
            }

            updateStatus(`Stopping: ${scriptName}...`);

            try {
                const response = await fetch(`${serverURL}/stop/${scriptName}`, {
                    method: 'POST'
                });

                const result = await response.text();
                updateStatus(result);

                // Update button states
                updateButtonStates(scriptName, false);
                // Refresh scriptlet list to get updated running status
                setTimeout(() => loadScriptlets(), 1000);

            } catch (error) {
                updateStatus(`ERROR: Failed to stop ${scriptName} - ${error.message}`);
            }
        }

        // Update button states for a scriptlet
        function updateButtonStates(scriptName, isRunning) {
            const scriptletId = scriptName.replace('.ahk', '');
            const card = document.querySelector(`[data-scriptlet-id="${scriptletId}"]`);
            if (!card) return;

            const runBtn = card.querySelector('.run-btn');
            const stopBtn = card.querySelector('.stop-btn');

            if (runBtn) {
                runBtn.disabled = isRunning;
            }
            if (stopBtn) {
                stopBtn.disabled = !isRunning;
            }
        }


        // Update status message
        function updateStatus(message) {
            const statusElement = document.getElementById('statusMessage');
            statusElement.textContent = message;
            
            // Clear previous timeouts
            if (window.statusTimeout) {
                clearTimeout(window.statusTimeout);
            }
            
            // Reset status after 5 seconds
            window.statusTimeout = setTimeout(() => {
                statusElement.textContent = 'Ready to launch scripts';
            }, 5000);
        }

        // Show helpful message on first load
        updateStatus('Start ScriptletCOMBridge.ahk to enable script launching');
    </script>
</body>
</html>
